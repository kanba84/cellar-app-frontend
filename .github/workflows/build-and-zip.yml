name: Build, Zip, and Release

permissions:
  contents: write
  pull-requests: read

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]

jobs:
  release:
    runs-on: ubuntu-latest
    # PR がマージされているか、または main push の場合のみ実行
    if: >
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ← 過去のコミット & タグをすべて取得
          fetch-tags: true # ← タグも必ず取得

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Archive build output
        run: zip -r build-artifact.zip build/

      - name: Determine release version
        id: determine_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # main への直接 push の場合はパッチバージョン +1
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
            MAJOR=$(echo $TAG | cut -d. -f1)
            MINOR=$(echo $TAG | cut -d. -f2)
            PATCH=$(echo $TAG | cut -d. -f3)
            PATCH=$((PATCH+1))
            VERSION="$MAJOR.$MINOR.$PATCH"
          else
            # PR マージの場合はタイトルからバージョン取得
            TITLE="${{ github.event.pull_request.title }}"
            if [[ "$TITLE" =~ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              VERSION="${BASH_REMATCH[1]}"
            else
              # conventional commit 判定 (feat/fix/patch)
              if [[ "$TITLE" =~ ^feat ]]; then
                TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
                MAJOR=$(echo $TAG | cut -d. -f1)
                MINOR=$(echo $TAG | cut -d. -f2)
                MINOR=$((MINOR+1))
                PATCH=0
                VERSION="$MAJOR.$MINOR.$PATCH"
              elif [[ "$TITLE" =~ ^fix ]]; then
                TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
                MAJOR=$(echo $TAG | cut -d. -f1)
                MINOR=$(echo $TAG | cut -d. -f2)
                PATCH=$(echo $TAG | cut -d. -f3)
                PATCH=$((PATCH+1))
                VERSION="$MAJOR.$MINOR.$PATCH"
              else
                # 判定できなければパッチ +1
                TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
                MAJOR=$(echo $TAG | cut -d. -f1)
                MINOR=$(echo $TAG | cut -d. -f2)
                PATCH=$(echo $TAG | cut -d. -f3)
                PATCH=$((PATCH+1))
                VERSION="$MAJOR.$MINOR.$PATCH"
              fi
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "Determined release version: $VERSION"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.version }}
          name: Release v${{ env.version }}
          body: |
            Automated release for version v${{ env.version }}.
          draft: false
          prerelease: false
          push: true   # リポジトリにタグも push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.version }}
          name: build-artifact.zip
          asset_path: build-artifact.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
