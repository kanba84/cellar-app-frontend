name: Build, Zip, and Release

permissions:
  contents: write
  pull-requests: read

on:
  pull_request:
    types: [closed]

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    env:
      VITE_API_TARGET: https://cellar-app.local # ←変更

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # ←重要

      - name: Install dependencies
        run: npm install

      - name: Build React app for production
        run: npm run build

      - name: Archive build output
        run: zip -r build-artifact.zip dist/ # ←ここ変更

      - name: Determine release version
        id: determine_version
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
          TAG=${LATEST_TAG##v}
          MAJOR=$(echo $TAG | cut -d. -f1)
          MINOR=$(echo $TAG | cut -d. -f2)
          PATCH=$(echo $TAG | cut -d. -f3)

          if [[ "$TITLE" =~ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "$TITLE" =~ ^feat ]]; then
            MINOR=$((MINOR+1))
            PATCH=0
            VERSION="$MAJOR.$MINOR.$PATCH"
          elif [[ "$TITLE" =~ ^fix ]]; then
            PATCH=$((PATCH+1))
            VERSION="$MAJOR.$MINOR.$PATCH"
          else
            PATCH=$((PATCH+1))
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          echo "version=v$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release with asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.version }}
          name: Release ${{ env.version }}
          files: build-artifact.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
