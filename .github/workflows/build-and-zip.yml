name: Build, Zip, and Release

permissions:
  contents: write
  pull-requests: read

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build, Zip, and Release React App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Build the React app
        run: npm run build

      - name: Archive build output
        run: |
          zip -r build-artifact.zip build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build-artifact.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: .

      - name: Determine release version
        id: determine_version
        run: |
          # mainブランチへのpush時は常にパッチバージョンを1つ上げる
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
          if [ "$TAG" = "" ]; then
            TAG="0.1.0"
          fi
          MAJOR=$(echo $TAG | cut -d. -f1)
          MINOR=$(echo $TAG | cut -d. -f2)
          PATCH=$(echo $TAG | cut -d. -f3)
          PATCH=$((PATCH+1))
          echo "version=$MAJOR.$MINOR.$PATCH" >> $GITHUB_ENV

      - name: Create GitHub Release with Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.version }}
          name: Release v${{ env.version }}
          body: |
            Automated release for version v${{ env.version }}.
          draft: false
          prerelease: false
          files: build-artifact.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
